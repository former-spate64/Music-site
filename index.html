<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Music Site</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <audio id="song1" src="Music/Song 1/Lime coconut.mp3"></audio>
    <audio id="song2" src="Music/Song 2/SIX60 - Don't Forget Your Roots.mp3"></audio>
    <audio id="song3" src="Music/Song 3/24 7.mp3"></audio>
    <audio id="song4" src="Music/Song 4/L.A.B - Take It Away (Official Music Video).mp3"></audio>
    <audio id="song5" src="Music/Song 5/Bills.mp3"></audio>
    <audio id="song6" src="Music/Song 6/Cool it down.mp3"></audio>
    <audio id="song7" src="Music/Song 7/Wang Chung - Everybody Have Fun Tonight (Official Music Video).mp3"></audio>
    <audio id="song8" src="Music/Song 8/Go Your Own Way.mp3"></audio>
    <audio id="song9" src="Music/Song 9/Oye Como Va.mp3"></audio>
    <audio id="song0" src="Music/Song 10/Overpass Graffiti.mp3"></audio>
    <div id="div">
    <input type="text" id="searchBox" placeholder="Find your vibe...">
    <button id="searchButton">
        <p id="searchtext">Search</p>
        <image id="searchicon" src="Assets/search.png" alt="Search Icon">
    </button>
    <div id="results"></div>
    <button id="ProfileButton">
        <image id="profilepng" src="Assets/Profile.png" alt="Profile Icon">
    </button>
    <container id="profile">
        <box id="profile1"></box>
        <box id="profile2"></box>
        <box id="profile3"></box>
        <box id="profile4"></box>
        <box id="profile5"></box>
        <image id="settingspng" src="Assets/setting.png"></image>
        <image id="profile2png" src="settings"></image>
        <image id="profile3png" src="settings"></image>
        <image id="profile4png" src="settings"></image>
        <image id="profile5png" src="settings"></image>
    </container>
    <container id="container1">
        <box id="box1">
            <button id="closebutton">
                <image id="close" src="Assets/menu.png" alt="Close Icon">
                <p id="menutext">Menu</p>
            </button>
        </box>
        <box id="box2">
            <button id="Button2" onclick="location.href='index.html'"></button>
            <image id="homeicon" src="Assets/home.png" alt="Home Icon">
            <a id="home">Home</a>
        </box>
        <box id="box3">
            <button id="Button3" onclick="location.href='library.html'"></button>
            <image id="libraryicon" src="Assets/library.png" alt="Library Icon">
            <a id="library">Library</a>
        </box>
        <box id="box4">
            <button id="Button4" onclick="location.href='discover.html'"></button>
            <image id="discovericon" src="Assets/discover.png" alt="Discover Icon">
            <a id="discover">Discover</a>
        </box>
        <box id="box5">
            <button id="Button5" onclick="alert('Thank you for your support!')"></button>
            <image id="donateicon" src="Assets/donate.png" alt="Donate Icon">
            <a id="donate">Donate</a>
        </box>
        <p id="version">Version 1.0</p>
    </container>
    <container id="audioplayback">
        <p id="songname"></p>
        <p id="songartist"></p>
        <button id="backbutton">back</button>
        <button id="pausebutton">play/pause</button>
        <button id="skipbutton">skip</button>
    </container>
    <script src="main.js"></script>
</body>
</div>
</html>
